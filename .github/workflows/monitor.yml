name: Weekly medication-rule monitor

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m medborderpipeline.run

      - name: Open reviewer issues for substantive changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in state/alerts/*.md; do
            title=$(head -n1 "$f" | sed 's/^# //')
            gh issue create --title "$title" --body-file "$f" --label "review-needed" || true
          done
          rm -f state/alerts/*.md

      - name: Commit updated state and site
        run: |
          git config user.name "medborder-bot"
          git config user.email "actions@github.com"
          git add state docs
          git diff --staged --quiet || git commit -m "Weekly monitor run [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
